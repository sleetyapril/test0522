<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KOSPI Defender — Play</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050816;color:#E5E7EB;font-family:'JetBrains Mono',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative}

/* ── Market Header ── */
#mkt{flex:none;padding:8px 14px 7px;background:rgba(11,16,32,.95);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.mh-l{flex:1;min-width:0}
.mh-sym{font-family:'Press Start 2P',monospace;font-size:6.5px;color:#6B7280;letter-spacing:.06em}
.mh-price{font-family:'Press Start 2P',monospace;font-size:13px;color:#fff;margin-top:3px}
.mh-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:2px 7px;border-radius:999px;font-family:'Press Start 2P',monospace;font-size:5.5px;letter-spacing:.05em;border:1px solid}
.bd-demo{border-color:rgba(96,165,250,.5);color:#bfdbfe;background:rgba(96,165,250,.1)}
.bd-danger{border-color:rgba(239,68,68,.6);color:#fecaca;background:rgba(239,68,68,.12)}
.bd-alert{border-color:rgba(239,68,68,.9);color:#fff;background:rgba(239,68,68,.25)}
.mh-dot{width:5px;height:5px;border-radius:50%;animation:blip 1.4s ease-in-out infinite}
.bd-demo .mh-dot{background:#60A5FA;box-shadow:0 0 5px #60A5FA}
.bd-danger .mh-dot{background:#EF4444;box-shadow:0 0 5px #EF4444}
.bd-alert .mh-dot{background:#EF4444;box-shadow:0 0 8px #EF4444;animation:blip .6s ease-in-out infinite}
.bd-live{border-color:rgba(34,197,94,.6);color:#bbf7d0;background:rgba(34,197,94,.12)}
.bd-live .mh-dot{background:#22C55E;box-shadow:0 0 6px #22C55E}
.bd-night{border-color:rgba(192,132,252,.6);color:#e9d5ff;background:rgba(192,132,252,.12)}
.bd-night .mh-dot{background:#C084FC;box-shadow:0 0 6px #C084FC}
.bd-closed{border-color:rgba(107,114,128,.4);color:#9CA3AF;background:rgba(107,114,128,.06)}
.bd-closed .mh-dot{background:#6B7280;box-shadow:none;animation:none}
.bd-nxt{border-color:rgba(251,191,36,.6);color:#fde68a;background:rgba(251,191,36,.12)}
.bd-nxt .mh-dot{background:#FBB724;box-shadow:0 0 6px #FBB724}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
#sparkline{width:72px;height:30px;flex:none}
.mh-r{text-align:right;flex:none}
.mh-chg{font-family:'Press Start 2P',monospace;font-size:10px;font-weight:700}
.up{color:#22C55E}.dn{color:#EF4444}.flat{color:#9CA3AF}
.mh-sub{font-size:9.5px;color:#6B7280;margin-top:2px}

/* ── Stage ── */
#stage{flex:1;position:relative;overflow:hidden;background:#050816}
#gc{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* ── Overlays ── */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:20;touch-action:manipulation}
.ov.hidden{display:none}
#ov-start{background:rgba(5,8,22,.96)}
#ov-alert{background:rgba(5,8,22,.93)}
#ov-go{background:rgba(5,8,22,.95)}

.ov-title{font-family:'Press Start 2P',monospace;line-height:1.7;letter-spacing:.04em}
.green-title{font-size:13px;color:#22C55E;text-shadow:0 0 18px rgba(34,197,94,.5)}
.red-title{font-size:13px;color:#EF4444;text-shadow:0 0 18px rgba(239,68,68,.5);animation:pulse-r .9s ease-in-out infinite}
@keyframes pulse-r{0%,100%{text-shadow:0 0 18px rgba(239,68,68,.5)}50%{text-shadow:0 0 36px rgba(239,68,68,1)}}
.ov-sub{font-size:11px;color:#6B7280;line-height:1.75;max-width:280px}
.ov-chg{font-family:'Press Start 2P',monospace;font-size:26px;color:#EF4444}
.ov-score{font-family:'Press Start 2P',monospace;font-size:11px;color:#FACC15}

.btn-g{padding:14px 32px;min-width:160px;min-height:48px;background:linear-gradient(180deg,#22C55E,#16A34A);color:#031d10;font-family:'Press Start 2P',monospace;font-size:8px;border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 0 1px rgba(34,197,94,.5),0 8px 28px -8px rgba(34,197,94,.5);letter-spacing:.04em;transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-g:active{transform:translateY(1px);opacity:.85}
.btn-r{padding:13px 28px;min-width:160px;min-height:48px;background:linear-gradient(180deg,rgba(239,68,68,.25),rgba(239,68,68,.1));color:#fecaca;font-family:'Press Start 2P',monospace;font-size:8px;border:1px solid rgba(239,68,68,.6);border-radius:8px;cursor:pointer;letter-spacing:.04em;transition:background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-r:active{background:rgba(239,68,68,.35);opacity:.85}
.type-row{display:flex;gap:8px}
.btn-type{flex:1;padding:12px 4px;background:rgba(17,24,39,.8);color:#6B7280;font-family:'Press Start 2P',monospace;font-size:7.5px;border:1px solid rgba(255,255,255,.1);border-radius:7px;cursor:pointer;letter-spacing:.04em;line-height:1.8;transition:all .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-type.active{background:rgba(34,197,94,.12);color:#22C55E;border-color:rgba(34,197,94,.45)}
.btn-type:active{opacity:.8}
.stock-panel{width:100%;margin-top:4px}
.stock-input{width:100%;padding:9px 11px;background:rgba(17,24,39,.9);color:#E5E7EB;font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid rgba(255,255,255,.15);border-radius:7px;outline:none;-webkit-appearance:none;box-sizing:border-box}
.stock-input::placeholder{color:#4B5563}
.stock-input:focus{border-color:rgba(34,197,94,.45)}
.stock-drop{width:100%;margin-top:3px;background:rgba(11,16,32,.98);border:1px solid rgba(255,255,255,.1);border-radius:7px;overflow:hidden}
.stock-item{padding:10px 11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stock-item:last-child{border-bottom:none}
.stock-item:hover,.stock-item:active{background:rgba(34,197,94,.1)}
.stock-item-name{font-family:'JetBrains Mono',monospace;font-size:10px;color:#E5E7EB}
.stock-item-meta{font-family:'Press Start 2P',monospace;font-size:5px;color:#6B7280;text-align:right}
.stock-chosen{margin-top:5px;padding:7px 11px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.stock-chosen-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:#22C55E}
.stock-chosen-code{font-family:'Press Start 2P',monospace;font-size:5px;color:#4B5563}

/* ── Status bar ── */
#sbar{flex:none;display:flex;padding:7px 8px;gap:5px;background:rgba(11,16,32,.95);border-top:1px solid rgba(255,255,255,.08)}
.sc{flex:1;background:rgba(17,24,39,.8);border-radius:7px;padding:6px 7px;border:1px solid rgba(255,255,255,.05)}
.sc-lbl{font-family:'Press Start 2P',monospace;font-size:5.5px;color:#6B7280;letter-spacing:.08em}
.sc-val{font-family:'Press Start 2P',monospace;font-size:8.5px;margin-top:3px}
.sc-bar{height:3px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:4px;overflow:hidden}
.sc-fill{height:100%;border-radius:99px;transition:width .5s ease,background .5s ease}
.sc.warn .sc-val{color:#EF4444}
.sc.good .sc-val{color:#22C55E}
.sc.blue .sc-val{color:#60A5FA}
.sc.neutral .sc-val{color:#9CA3AF}
</style>
</head>
<body>

    <div class="sc neutral" id="scMkt">

      <div class="sc-val" id="scMktV">±0.00%</div>
      <div class="sc-bar"><div class="sc-fill" id="scMktF" style="width:0%"></div></div>
    </div>

const E_TYPES  = ['eA','eB','eC','eD'];
const E_COLORS = ['#60A5FA','#34D399','#FACC15','#C084FC'];

// ═══════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
const stage  = document.getElementById('stage');
let W = 0, H = 0, DPR = 1;
const P = 4; // CSS px per sprite pixel

function resize() {
  DPR = window.devicePixelRatio || 1;
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
}
new ResizeObserver(resize).observe(stage);
resize();

function searchLocal(q) {
  const kw = q.toLowerCase().replace(/\s+/g, '');
  return STOCKS.filter(s =>
    s.n.toLowerCase().replace(/\s+/g, '').includes(kw) ||
    s.c.startsWith(q)
  ).slice(0, 6).map(s => ({ name: s.n, code: s.c, market: s.m }));
}

// AUDIO

let _ac = null;
const ac = () => _ac || (_ac = new (window.AudioContext||window.webkitAudioContext)());
function beep(f, d, type='square', v=0.06) {
  try {
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+d);
    o.start(); o.stop(c.currentTime+d);
  } catch(_){}
}
const sfx = {
  shoot:   ()=>beep(880,.06,'square',.04),
  hit:     ()=>beep(300,.07,'sawtooth',.07),
  explode: ()=>beep(110,.18,'sawtooth',.1),
  die:     ()=>{beep(120,.2,'sawtooth',.14);setTimeout(()=>beep(80,.3,'sawtooth',.12),180)},
  wave:    ()=>{beep(660,.15,'square',.07);setTimeout(()=>beep(880,.2,'square',.07),200)},
  alert:   ()=>{beep(440,.1,'square',.1);setTimeout(()=>beep(330,.1,'square',.1),160);setTimeout(()=>beep(220,.25,'square',.12),320)},
};

const MKT = {

  hist: [],
  alertFired: false,

  simTimer: 0,
  pollErrors: 0,
  type: 'futures',   // 'futures' | 'spot' | 'stock'

  stockName: '',
};

// ── KST 세션 판별 (UTC+9) ──
function getSession() {
  const kst = new Date(Date.now() + 9*3600000);
  const day = kst.getUTCDay();  // 0=일,1=월,...,6=토
  const t   = kst.getUTCHours()*60 + kst.getUTCMinutes();
  if (day>=1&&day<=5&&t>=540&&t<=945) return 'day';   // 주간 09:00-15:45
  if (t>=1080&&day>=1&&day<=6)        return 'night'; // 야간 18:00- (월-토)
  if (t<360&&(day>=2||day===0))       return 'night'; // 야간 -06:00 (화-일)
  return 'closed';
}

// ── 클라이언트 30초 변화율 슬라이딩 윈도우 ──
// Vercel(서버리스)은 상태 없음 → 클라이언트에서 직접 계산
const _priceWin = [];
function _pushWin(price) {
  _priceWin.push({price, ts: Date.now()});
  const cut = Date.now() - 45000;
  while (_priceWin.length && _priceWin[0].ts < cut) _priceWin.shift();
}
function _calc1m(cur) {
  if (!_priceWin.length) return 0;
  const target = Date.now() - 30000;
  let best = _priceWin[0];
  for (const p of _priceWin) {
    if (Math.abs(p.ts - target) < Math.abs(best.ts - target)) best = p;
  }
  if (Math.abs(best.ts - target) > 18000) return 0;
  return (cur - best.price) / best.price * 100;
}

// ── 백엔드 /api/market 에서 실시간 데이터 수신 ──
async function fetchMarket() {
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), 6000);
  try {
    let url = '/api/market?type=' + MKT.type;
    if (MKT.type === 'stock') {
      if (!MKT.stockCode) throw new Error('stock code missing');
      url += '&code=' + MKT.stockCode;
    }
    const r = await fetch(url, {signal:ctrl.signal, cache:'no-store'});
    clearTimeout(id);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) { clearTimeout(id); throw e; }
}

// ── 데이터 적용 ──
function applyData(price, ch, source) {
  MKT.price=price; MKT.ch=ch; MKT.source=source;
  MKT.hist.push(price);
  if (MKT.hist.length>30) MKT.hist.shift();
  refreshMarketUI();
  applyDifficulty();
  if (MKT.ch<=-1.5&&!MKT.alertFired&&gstate==='playing') {
    MKT.alertFired=true; triggerAlert();
  }
}

function normalizeSource(source) {
  if (source === 'day' || source === 'day_futures') return 'live-day-futures';
  if (source === 'night' || source === 'night_futures') return 'live-night-futures';
  if (source === 'spot_fallback' || source === 'spot' || source === 'stock' || source === 'nxt') return 'spot-fallback';
  if (source === 'closed') return 'closed';
  return 'demo';
}

function sourceApiName(source) {
  if (source === 'live-day-futures') return 'KIS [국내선물옵션] 실시간시세 > 지수선물 실시간체결가';
  if (source === 'live-night-futures') return 'KIS [국내선물옵션] 실시간시세 > KRX야간선물 실시간종목체결';
  if (source === 'spot-fallback' && MKT.type === 'stock') return 'Naver domestic stock quote';
  if (source === 'spot-fallback' && MKT.type === 'spot') return 'Naver KOSPI200 spot quote';
  if (source === 'spot-fallback') return 'KOSPI200 Spot Fallback';
  return 'Demo Mode';
}

function logMarketData(d, source) {
  const symbol = d.contractCode || (MKT.type === 'stock' ? (MKT.stockCode || MKT.stockName) : 'KPI200');
  console.log('[market-subscription]', {
    apiName: sourceApiName(source),
    symbol,
    timestamp: new Date(d.ts || Date.now()).toISOString(),
    lastPrice: d.price,
  });
}

// ── 시뮬레이션 tick (서버 응답 없을 때 fallback) ──
function simTick() {
  const shock=(Math.random()-.47)*.55;
  const rev=-MKT.ch*.28;
  const ch=Math.max(-2.8,Math.min(1.6,MKT.ch+shock+rev));
  applyData(MKT.price*(1+ch/100), ch, 'demo');
}

// ── 폴링 ──
async function pollMarket() {
  try {
    const d = await fetchMarket();
    MKT.session = d.session;
    if (d.name && MKT.type === 'stock' && !MKT.stockName) MKT.stockName = d.name;

    const source = normalizeSource(d.source);
    logMarketData(d, source);

    if (MKT.type === 'stock' && d.source !== 'stock' && d.source !== 'closed') {
      throw new Error('stock mode received non-stock source: ' + d.source);
    }

    if (source === 'live-day-futures' || source === 'live-night-futures' || source === 'spot-fallback') {
      _pushWin(d.price);
      const ch1m = d.ch1m !== 0 ? d.ch1m : _calc1m(d.price);
      applyData(d.price, Math.max(-3, Math.min(2, ch1m)), source);
    } else {
      if (d.price > 0) MKT.price = d.price;
      MKT.ch = 0;
      MKT.source = source;
      refreshMarketUI();
      applyDifficulty();
    }
  } catch(e) {
    console.warn('[pollMarket]', e.message);
    if (MKT.type === 'stock') return;
    if (MKT.source !== 'live-day-futures' && MKT.source !== 'live-night-futures') simTick();
  }
}

let _poll=null;
function startPolling() {
  pollMarket();
  clearInterval(_poll);
  // 서버가 pollingInterval을 내려주면 그 값 사용, 없으면 10초
  _poll = setInterval(pollMarket, 10000);
}

function bulletLevel() {
  if (MKT.ch >= 0.3) return 3;
  if (MKT.ch >= 0)   return 2;
  return 1;
}
function warnLevel() {
  if (MKT.ch <= -1.5) return 5;
  if (MKT.ch <= -.7)  return 4;
  if (MKT.ch <= -.3)  return 3;
  if (MKT.ch <   0)   return 2;
  return 1;
}

// GAME STATE
// ═══════════════════════════════════════════════
let gstate = 'start'; // start | playing | alert | gameover
let player, enemies, pBullets, eBullets, particles;
let lives, score, wave, diffMult;
let autoFireT = 0;
let shakeT = 0;
let bannerT = 0, bannerTxt = '';
let eDir = 1, eMoveT = 0, eMoveI = 800, eDescend = false;
let slowDescentT = 0;
let lastTS = 0;

// ═══════════════════════════════════════════════
// INIT / RESET
// ═══════════════════════════════════════════════
function initGame() {
  const pw = SPR.player[0].length * P;
  const ph = SPR.player.length    * P;
  player = { x: W/2, y: H-56, w: pw, h: ph, inv: 0 };
  enemies   = buildGrid();
  pBullets  = [];
  eBullets  = [];
  particles = [];
  lives = 3; score = 0; wave = 1; diffMult = 1;
  autoFireT = 0; shakeT = 0; bannerT = 0;
  eDir = 1; eMoveT = 0; eMoveI = 800; eDescend = false; slowDescentT = 0;
  MKT.alertFired = false;
  MKT.ch = 0; MKT.simTimer = 0; MKT.pollErrors = 0;
  startPolling();
}

const COLS = 7, ROWS = 4, GAP_X = 44, GAP_Y = 40;

function buildGrid() {
  const list = [];
  const sw = 6*P, sh = 6*P;
  const totalW = (COLS-1)*GAP_X + sw;
  const ox = (W - totalW)/2 + sw/2;
  const oy = 52;
  for (let r=0; r<ROWS; r++) {
    for (let c=0; c<COLS; c++) {
      list.push({
        x: ox + c*GAP_X,
        y: oy + r*GAP_Y,
        w: sw, h: sh,
        type:  E_TYPES[r],
        color: E_COLORS[r],
        hp:    E_HP[r],
        alive: true,
        sht: Math.random()*2500,
      });
    }
  }
  return list;
}

function applyDifficulty() {
  const ch = MKT.ch;
  if      (ch <= -.7)  { diffMult = 2.0 + Math.abs(ch)*.25; eMoveI = 380; }
  else if (ch <= -.3)  { diffMult = 1.5; eMoveI = 580; }
  else if (ch >=  .3)  { diffMult = 0.8; eMoveI = 980; }
  else                 { diffMult = 1.0; eMoveI = 780; }
  eMoveI = Math.max(140, eMoveI - (wave-1)*45);
}

// INPUT

let drag = null;

stage.addEventListener('touchstart', e=>{
  if (gstate!=='playing') return;  // 오버레이 버튼 탭은 막지 않음
  e.preventDefault();
  const t = e.touches[0];
  drag = { startX: t.clientX, playerX: player.x };
},{passive:false});
stage.addEventListener('touchmove', e=>{
  if (gstate!=='playing'||!drag) return;
  e.preventDefault();  // 게임 중 스크롤만 차단
  const dx = e.touches[0].clientX - drag.startX;
  player.x = clamp(drag.playerX + dx, player.w/2, W - player.w/2);
},{passive:false});
stage.addEventListener('touchend', ()=>{ drag=null; },{passive:false});

let mDrag = null;
stage.addEventListener('mousedown', e=>{
  if (gstate!=='playing') return;
  mDrag = { startX: e.clientX, playerX: player.x };
});
window.addEventListener('mousemove', e=>{
  if (!mDrag) return;
  const dx = e.clientX - mDrag.startX;
  player.x = clamp(mDrag.playerX + dx, player.w/2, W - player.w/2);
});
window.addEventListener('mouseup', ()=>{ mDrag=null; });

// ═══════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════
function update(dt) {
  if (gstate !== 'playing') return;

  shakeT = Math.max(0, shakeT - dt);
  bannerT = Math.max(0, bannerT - dt);

  // Auto fire
  const fi = bulletLevel()===3 ? 240 : bulletLevel()===2 ? 320 : 420;
  autoFireT += dt;
  if (autoFireT >= fi) { autoFireT = 0; firePlayer(); }

  // 시뮬레이션 tick — 라이브 데이터 없을 때만 실행
  if (MKT.source === 'demo') {
    MKT.simTimer += dt;
    if (MKT.simTimer >= 14000) { MKT.simTimer = 0; simTick(); }
  }

  // Player bullets
  for (let i=pBullets.length-1;i>=0;i--) {
    pBullets[i].y -= 7;
    if (pBullets[i].y < -12) pBullets.splice(i,1);
  }

  // Enemy movement
  eMoveT += dt;
  if (eMoveT >= eMoveI) { eMoveT=0; moveEnemies(); }

  // Slow descent (pressure)
  slowDescentT += dt;
  if (slowDescentT >= 4000) {
    slowDescentT = 0;
    for (const e of enemies) e.y += 6;
  }

  // Enemy shooting
  const alive = enemies.filter(e=>e.alive);
  const baseI = MKT.ch <= -.7 ? 1100 : MKT.ch <= -.3 ? 1700 : 2400;
  for (const e of alive) {
    e.sht += dt;
    if (e.sht >= baseI / diffMult) {
      e.sht = Math.random() * (baseI/diffMult) * .4;
      fireEnemy(e);
    }
  }

  // Enemy bullets
  for (let i=eBullets.length-1;i>=0;i--) {
    const b=eBullets[i];
    b.x+=b.vx; b.y+=b.vy;
    if (b.y>H+12||b.x<-12||b.x>W+12) eBullets.splice(i,1);
  }

  // Collision: player bullets vs enemies
  for (let bi=pBullets.length-1;bi>=0;bi--) {
    const b=pBullets[bi];
    let hit=false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (overlap(b.x-2,b.y-6,4,12, e.x-e.w/2,e.y-e.h/2,e.w,e.h)) {
        e.hp--; sfx.hit();
        burst(b.x,b.y,e.color,5);
        if (e.hp<=0) { e.alive=false; score+=100*wave*(MKT.ch>=.3?2:1); sfx.explode(); burst(e.x,e.y,e.color,14); }
        hit=true; break;
      }
    }
    if (hit) pBullets.splice(bi,1);
  }

  // Collision: enemy bullets vs player
  if (player.inv<=0) {
    for (let i=eBullets.length-1;i>=0;i--) {
      const b=eBullets[i];
      if (overlap(b.x-2,b.y-5,4,10, player.x-player.w/2,player.y-player.h/2,player.w,player.h)) {
        eBullets.splice(i,1); hitPlayer(); break;
      }
    }
  } else {
    player.inv = Math.max(0, player.inv-dt);
  }

  // Enemy reaches bottom
  for (const e of alive) {
    if (e.y+e.h/2 >= H-50) { doGameOver(); return; }
  }

  // Particles
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.18; p.life-=.025;
    if (p.life<=0) particles.splice(i,1);
  }

  // Panic effects
  if (MKT.ch<=-.7 && Math.random()<.025) {
    shakeT=180;
    if (Math.random()<.35) { bannerTxt='! MARKET ALERT !'; bannerT=500; }
  }

  // All dead → next wave
  if (alive.length===0) nextWave();

  refreshStatusUI();
}

function moveEnemies() {
  const alive = enemies.filter(e=>e.alive);
  if (!alive.length) return;
  if (eDescend) {
    enemies.forEach(e=>e.y+=18);
    eDescend=false;
    return;
  }
  const minX = Math.min(...alive.map(e=>e.x-e.w/2));
  const maxX = Math.max(...alive.map(e=>e.x+e.w/2));
  if (eDir===1 && maxX>=W-8)       { eDir=-1; eDescend=true; }
  else if (eDir===-1 && minX<=8)   { eDir= 1; eDescend=true; }
  else enemies.forEach(e=>e.x+=eDir*16);
}

function firePlayer() {
  const lv = bulletLevel();
  sfx.shoot();
  const y = player.y - player.h/2;
  if (lv>=3)      { pBullets.push({x:player.x-9,y},{x:player.x,y},{x:player.x+9,y}); }
  else if (lv>=2) { pBullets.push({x:player.x-5,y},{x:player.x+5,y}); }
  else            { pBullets.push({x:player.x,y}); }
}

function fireEnemy(e) {
  const aimed = MKT.ch<=-.3 && Math.random()<.45;
  let vx=0, vy=3.5*diffMult;
  if (aimed && player) {
    const dx=player.x-e.x, dy=player.y-e.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    vx=(dx/d)*3.5*diffMult; vy=(dy/d)*3.5*diffMult;
  }
  eBullets.push({x:e.x,y:e.y+e.h/2,vx,vy,aimed});
}

function hitPlayer() {
  sfx.die(); burst(player.x,player.y,'#22C55E',18);
  lives--;
  if (lives<=0) { doGameOver(); return; }
  player.x=W/2; player.inv=2200;
  bannerTxt='! HIT !'; bannerT=700;
}

function nextWave() {
  wave++; sfx.wave();
  enemies=buildGrid(); eBullets=[];
  applyDifficulty();
  bannerTxt='WAVE ' + String(wave).padStart(2,'0');
  bannerT=1200;
}

function triggerAlert() {
  sfx.alert(); gstate='alert';
  document.getElementById('ovAlertChg').textContent = fmtCh(MKT.ch);
  show('ov-alert');
}
function doGameOver() {
  gstate='gameover';
  document.getElementById('ovScore').textContent = 'SCORE ' + String(score).padStart(6,'0');
  const msg = MKT.ch <= -1.5 ? '시장이 급변했습니다\n관심종목을 확인하세요' :
              lives <= 0      ? '모든 방어선이 무너졌습니다' : '적이 방어선을 돌파했습니다';
  document.getElementById('ovGoMsg').textContent = msg;
  show('ov-go');
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  ctx.setTransform(DPR,0,0,DPR,0,0);

  // Screen shake
  if (shakeT>0) {
    const m = Math.min(shakeT/60,4);
    ctx.translate((Math.random()-.5)*m*2,(Math.random()-.5)*m*2);
  }

  // Background
  ctx.fillStyle='#050816';
  ctx.fillRect(0,0,W,H);

  // Panic tint
  if (MKT.ch <= -.7) {
    const a = Math.min(.08, Math.abs(MKT.ch)*.04) * (Math.sin(Date.now()/300)*.5+.5);
    ctx.fillStyle=`rgba(239,68,68,${a})`;
    ctx.fillRect(0,0,W,H);
  }

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.022)';
  ctx.lineWidth=.5;
  for (let x=0;x<W;x+=32){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for (let y=0;y<H;y+=32){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  if (gstate==='playing'||gstate==='alert') {
    drawEnemies();
    drawPlayer();
    drawBullets();
    drawParticles();
    drawHUD();
  }
}

function drawSprite(spr, color, cx, cy, px) {
  const cols=spr[0].length, rows=spr.length;
  const sx=cx-cols*px/2, sy=cy-rows*px/2;
  ctx.fillStyle=color;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
    if (spr[r][c]) ctx.fillRect(sx+c*px, sy+r*px, px-1, px-1);
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    ctx.save();
    ctx.shadowColor=e.color; ctx.shadowBlur=10;
    drawSprite(SPR[e.type], e.color, e.x, e.y, P);
    ctx.restore();
  }
}

function drawPlayer() {
  if (!player) return;
  if (player.inv>0 && Math.floor(player.inv/100)%2===0) return;
  ctx.save();
  if (bulletLevel()>=2) { ctx.shadowColor='#22C55E'; ctx.shadowBlur=14; }
  drawSprite(SPR.player,'#22C55E',player.x,player.y,P);
  ctx.restore();
  // Lives
  for (let i=0;i<lives;i++) drawSprite(SPR.player,'#22C55E',14+i*16,H-11,2);
}

function drawBullets() {
  ctx.save();
  ctx.shadowColor='#22C55E'; ctx.shadowBlur=7;
  ctx.fillStyle='#22C55E';
  for (const b of pBullets) ctx.fillRect(b.x-1.5,b.y-5,3,10);
  ctx.restore();
  for (const b of eBullets) {
    const col=b.aimed?'#FACC15':'#EF4444';
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=7;
    ctx.fillStyle=col;
    ctx.fillRect(b.x-2,b.y-4,4,9);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function drawHUD() {
  ctx.textBaseline='top';
  // Score
  ctx.font='7px "Press Start 2P"';
  ctx.fillStyle='#FACC15'; ctx.textAlign='center';
  ctx.fillText(String(score).padStart(6,'0'), W/2, 6);
  // Wave
  ctx.fillStyle='#9CA3AF'; ctx.textAlign='left';
  ctx.fillText('WAVE '+String(wave).padStart(2,'0'), 7, 6);
  // Diff
  ctx.textAlign='right';
  ctx.fillStyle=diffMult>=1.5?'#EF4444':diffMult<=0.9?'#22C55E':'#9CA3AF';
  ctx.fillText('×'+diffMult.toFixed(1), W-7, 6);
  // Banner
  if (bannerT>0) {
    const alpha=Math.min(1,bannerT/200);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font='9px "Press Start 2P"';
    ctx.fillStyle='#EF4444'; ctx.textAlign='center';
    ctx.shadowColor='#EF4444'; ctx.shadowBlur=20;
    ctx.fillText(bannerTxt, W/2, H/2-18);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function burst(x,y,color,n=12){
  for(let i=0;i<n;i++) particles.push({
    x,y,color,size:Math.random()*4+2,life:1,
    vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-1,
  });
}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function clamp(v,min,max){return Math.min(Math.max(v,min),max)}
function fmtCh(ch){ return (ch>=0?'+':'')+ch.toFixed(2)+'%'; }
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

function refreshMarketUI() {
  const ch=MKT.ch;
  document.getElementById('mhPrice').textContent=MKT.price.toFixed(2);
  const ce=document.getElementById('mhChg');
  ce.textContent=fmtCh(ch);
  ce.className='mh-chg '+(ch>=.05?'up':ch<=-.05?'dn':'flat');
  document.getElementById('mhSub').textContent='1m '+fmtCh(ch);

  // 데이터 소스 표시
  const src = MKT.source;
  const symEl = document.getElementById('mhSym');
  const typeLabel = src === 'spot-fallback' && MKT.type === 'futures' ? 'KOSPI200 Spot Fallback'
                  : MKT.type === 'futures' ? 'KOSPI 200 F'
                  : MKT.type === 'stock'   ? (MKT.stockName || MKT.stockCode || '종목')
                  : 'KOSPI 200';
  if      (src==='live-day-futures')   symEl.textContent=typeLabel+' · KIS DAY ↻';
  else if (src==='live-night-futures') symEl.textContent=typeLabel+' · KIS NIGHT ↻';
  else if (src==='spot-fallback')      symEl.textContent=typeLabel;
  else                         symEl.textContent=typeLabel;

  // Source badge
  const bd=document.getElementById('mhBadge');
  const bt=document.getElementById('mhBadgeTxt');
  if      (src==='live-day-futures')   { bd.className='mh-badge bd-live';   bt.textContent='LIVE KIS DAY FUTURES'; }
  else if (src==='live-night-futures') { bd.className='mh-badge bd-night';  bt.textContent='LIVE KIS NIGHT FUTURES'; }
  else if (src==='spot-fallback')      { bd.className='mh-badge bd-nxt';    bt.textContent='SPOT FALLBACK'; }
  else                                 { bd.className='mh-badge bd-demo';   bt.textContent='DEMO MODE'; }

  drawSparkline();
}

function drawSparkline() {
  const h=MKT.hist;
  if (h.length<2) return;
  const minP=Math.min(...h), maxP=Math.max(...h), range=maxP-minP||1;
  const W2=72,H2=30;
  const pts=h.map((p,i)=>({
    x:(i/(h.length-1))*W2,
    y:H2-((p-minP)/range)*(H2-4)-2,
  }));
  const dn=h[h.length-1]<h[0];
  const col=dn?'#EF4444':'#22C55E';
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++) d+=` L${pts[i].x} ${pts[i].y}`;
  document.getElementById('sparkline').innerHTML=`
    <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".45"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d}" stroke="${col}" stroke-width="1.5" fill="none"/>
    <path d="${d} L${pts[pts.length-1].x} ${H2} L${pts[0].x} ${H2} Z" fill="url(#sg)"/>`;
}

function refreshStatusUI() {
  const ch=MKT.ch, wl=warnLevel(), bl=bulletLevel();
  // Market
  document.getElementById('scMktV').textContent=fmtCh(ch);
  const mp=Math.min(100,Math.abs(ch)/2.8*100);
  const mf=document.getElementById('scMktF');
  mf.style.width=mp+'%';
  mf.style.background=ch<0?'#EF4444':'#22C55E';
  const mc=document.getElementById('scMkt');
  mc.className='sc '+(ch<-.3?'warn':ch>.3?'good':'neutral');
  // Bullet
  document.getElementById('scBulV').textContent='LV '+bl;
  document.getElementById('scBulF').style.width=(bl/3*100)+'%';
  // Warning
  document.getElementById('scWrnV').textContent='LV '+wl;
  const wf=document.getElementById('scWrnF');
  wf.style.width=(wl/5*100)+'%';
  wf.style.background=wl>=3?'#EF4444':'#FACC15';
  document.getElementById('scWrn').className='sc '+(wl>=3?'warn':wl>=2?'neutral':'neutral');
}

// ═══════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════
function loop(ts) {
  const dt = Math.min(ts - lastTS, 50);
  lastTS = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
// BUTTON WIRING
// ═══════════════════════════════════════════════
function setMarketType(type) {
  MKT.type = type;
  MKT.source = 'demo';
  MKT.hist = Array.from({ length: 30 }, () => MKT.price);
  document.getElementById('btnTypeFutures').classList.toggle('active', type==='futures');
  document.getElementById('btnTypeSpot').classList.toggle('active', type==='spot');
  document.getElementById('btnTypeStock').classList.toggle('active', type==='stock');
  document.getElementById('stockPanel').style.display = type==='stock' ? 'block' : 'none';
  if (type !== 'stock') {
    document.getElementById('startNote').textContent =
      type==='futures' ? '선물 · KIS REST' : '현물 · Naver KPI200';
  } else {
    document.getElementById('startNote').textContent =
      MKT.stockCode ? MKT.stockName + ' (' + MKT.stockCode + ')' : '종목을 검색하여 선택하세요';
  }
}
document.getElementById('btnTypeFutures').addEventListener('click', ()=>setMarketType('futures'));
document.getElementById('btnTypeSpot').addEventListener('click', ()=>setMarketType('spot'));
document.getElementById('btnTypeStock').addEventListener('click', ()=>setMarketType('stock'));

// ── 종목 검색 ──
let _searchTimer = null;
document.getElementById('stockInput').addEventListener('input', e => {
  clearTimeout(_searchTimer);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('stockDrop').style.display='none'; return; }
  _searchTimer = setTimeout(() => fetchStockSearch(q), 320);
});
// Enter 키: 6자리 코드 → 직접 선택 / 이름 → 검색 후 첫 결과 자동 선택
document.getElementById('stockInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (!v) return;
  if (/^\d{6}$/.test(v)) selectStock(v, v);
  else fetchStockSearch(v, true);
});

// autoSelect=true 이면 첫 번째 결과를 즉시 선택 (PLAY·Enter 경유)
async function fetchStockSearch(q, autoSelect = false) {
  // 1순위: 로컬 내장 목록 (API 불필요, 즉시 응답)
  const local = searchLocal(q);
  if (local.length > 0) {
    if (autoSelect) { selectStock(local[0].code, local[0].name); return true; }
    renderStockDrop(local);
    return true;
  }
  // 2순위: 서버 API (내장 목록에 없는 종목)
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q), { signal: AbortSignal.timeout(5000) });
    if (!r.ok) return false;
    const d = await r.json();
    const results = d.results || [];
    if (autoSelect && results.length > 0) { selectStock(results[0].code, results[0].name); return true; }
    renderStockDrop(results);
    return results.length > 0;
  } catch(_) { return false; }
}

function renderStockDrop(results) {
  const el = document.getElementById('stockDrop');
  if (!results.length) { el.style.display='none'; return; }
  el.innerHTML = results.map(s =>
    `<div class="stock-item" data-code="${s.code}" data-name="${s.name}">
       <span class="stock-item-name">${s.name}</span>
       <span class="stock-item-meta">${s.code}<br>${s.market}</span>
     </div>`
  ).join('');
  el.style.display = 'block';
  el.querySelectorAll('.stock-item').forEach(item => {
    // pointerdown: 모바일/데스크탑 공통, click 보다 먼저 실행되어 더 신뢰성 높음
    item.addEventListener('pointerdown', e => {
      e.preventDefault();
      selectStock(item.dataset.code, item.dataset.name);
    });
  });
}

function selectStock(code, name) {
  MKT.stockCode = code;
  MKT.stockName = name;
  document.getElementById('stockDrop').style.display = 'none';
  document.getElementById('stockInput').value = '';
  document.getElementById('stockChosen').style.display = 'flex';
  document.getElementById('stockChosenName').textContent = name;
  document.getElementById('stockChosenCode').textContent = code;
  document.getElementById('startNote').textContent = name + ' (' + code + ')';
}

document.getElementById('btnStart').addEventListener('click', async ()=>{
  if (MKT.type === 'stock' && !MKT.stockCode) {
    const q = document.getElementById('stockInput').value.trim();
    if (/^\d{6}$/.test(q)) {
      selectStock(q, q);                      // 6자리 코드 직접 사용
    } else if (q) {
      const ok = await fetchStockSearch(q, true);
      if (!ok) {
        // 검색 API 실패 시 안내 (검색 없이 6자리 코드로 입력 유도)
        document.getElementById('startNote').textContent = '검색 실패 — 6자리 코드로 입력 후 Enter';
        document.getElementById('stockInput').value = '';
        document.getElementById('stockInput').placeholder = '코드 입력 (예: 005930)';
        return;
      }
    } else {
      document.getElementById('startNote').textContent = '종목명 또는 6자리 코드를 입력하세요';
      return;
    }
    if (!MKT.stockCode) return;  // selectStock 미호출 guard
  }

  // 종목 모드: 게임 시작 전 현재가 미리 조회
  let _prefetchCh = null;
  let _prefetchOk = MKT.type !== 'stock';
  if (MKT.type === 'stock') {
    document.getElementById('startNote').textContent = '가격 조회 중...';
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch('/api/market?type=stock&code=' + MKT.stockCode, { signal: ctrl.signal });
      if (r.ok) {
        const d = await r.json();
        if (d.price > 0) {
          MKT.price  = d.price;
          MKT.hist   = Array.from({ length: 30 }, () => d.price * (1 + (Math.random() - .5) * .002));
          MKT.source = normalizeSource(d.source);
          logMarketData(d, MKT.source);
          if (d.name && !MKT.stockName) MKT.stockName = d.name;
          _prefetchCh = 0;
          _prefetchOk = d.source === 'stock' && d.price > 0;
        }
      }
    } catch (e) {
      console.warn('[stock prefetch]', e.message);
    }
    if (!_prefetchOk) {
      document.getElementById('startNote').textContent = '종목 현재가 조회 실패 — 잠시 후 다시 시도';
      return;
    }
  }

  hide('ov-start');
  initGame(); gstate = 'playing';

  // initGame()이 MKT.ch를 0으로 리셋 → pre-fetch 값 복원 후 헤더 즉시 갱신
  if (_prefetchCh !== null) MKT.ch = _prefetchCh;
  refreshMarketUI();
  applyDifficulty();
});
document.getElementById('btnAlert').addEventListener('click', ()=>{
  hide('ov-alert');
  doGameOver();
});
document.getElementById('btnRetry').addEventListener('click', ()=>{
  hide('ov-go');
  initGame(); gstate='playing';
});

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
// startPolling은 initGame() 안에서만 호출 — 선택된 type에 맞는 데이터만 폴링
requestAnimationFrame(ts=>{ lastTS=ts; requestAnimationFrame(loop); });
</script>
